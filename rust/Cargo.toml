[package]
name = "hyperxos-core"
version = "2.2.0"
edition = "2021"
authors = ["HyperXOS Team <budicuy@hyperxos.org>"]
description = "Unified Pure Rust Desktop Environment, System Tools, Native Installer, Hardware Engine, CLI & VM Runner for HyperXOS Linux"
license = "GPL-3.0-or-later"
repository = "https://github.com/budicuy/HyperXOS"

[lib]
name = "hyperx_ui_kit"
path = "hyperx-ui-kit/src/lib.rs"

[[bin]]
name = "hyperx-de"
path = "hyperx-de/src/main.rs"

[[bin]]
name = "hyper-x-tools"
path = "hyper-x-tools/src/main.rs"

[[bin]]
name = "hyper-x-installer"
path = "hyper-x-installer/src/main.rs"

[[bin]]
name = "hyper-x-hw"
path = "hyper-x-hw/src/main.rs"

[[bin]]
name = "hyperx"
path = "hyperx-cli/src/main.rs"

[[bin]]
name = "hyperx-vm"
path = "hyperx-vm/src/main.rs"

[dependencies]
iced = { version = "0.14", features = [
    "wgpu",
    "image",
    "svg",
    "wayland",
    "x11",
    "tokio",
    "canvas",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
smithay = { version = "0.7.0", default-features = false, features = [
    "desktop",
    "wayland_frontend",
] }
sysinfo = "0.33"
chrono = "0.4"
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
clap = { version = "4.5", features = ["derive"] }
nix = { version = "0.31", features = [
    "mount",
    "sched",
    "fs",
    "signal",
    "process",
    "user",
] }
toml = "0.8"
sha2 = "0.10"

[profile.dev]
opt-level = 0
debug = true
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
lto = "thin"
incremental = false
codegen-units = 16
debug = 0
strip = "symbols"
