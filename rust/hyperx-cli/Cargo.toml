[package]
name = "hyperx-cli"
version = "1.0.0"
edition = "2021"
authors = ["HyperXOS Development Team <dev@hyperxos.org>"]
description = "Unified Pure Rust Developer & Build Automation Toolchain for HyperXOS Linux"
license = "GPL-3.0-or-later"

[[bin]]
name = "hyperx"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
