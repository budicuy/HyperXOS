[package]
name = "hyperx-session"
version = "0.1.0"
edition = "2021"
authors = ["HyperXOS Team <dev@hyperxos.org>"]
description = "Desktop Session Coordinator & Autostart Manager for hyperx-de"
license = "GPL-3.0-or-later"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
zbus = "5.5"
nix = { version = "0.29", features = ["process", "signal"] }
