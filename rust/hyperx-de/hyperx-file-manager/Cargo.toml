[package]
name = "hyperx-file-manager"
version = "0.1.0"
edition = "2021"
authors = ["HyperXOS Team <dev@hyperxos.org>"]
description = "Modern Pure Rust macOS Finder-style File Manager with Miller Columns & Quick Look for HyperXOS"
license = "GPL-3.0-or-later"

[dependencies]
iced = { version = "0.14", features = ["wgpu", "image", "svg", "wayland", "tokio"] }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"
trash = "5.2"
open = "5.3"
walkdir = "2.5"
mime_guess = "2.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
