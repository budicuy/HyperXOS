[package]
name = "hyperx-shell"
version = "0.1.0"
edition = "2021"
authors = ["HyperXOS Team <dev@hyperxos.org>"]
description = "Pure Rust macOS-style Shell, Top Bar, Dock, Dynamic Island & Control Center for hyperx-de"
license = "GPL-3.0-or-later"

[dependencies]
iced = { version = "0.14", features = ["wgpu", "image", "svg", "wayland", "tokio"] }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
sysinfo = "0.33"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
