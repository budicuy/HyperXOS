[package]
name = "hyperx-settings"
version = "0.1.0"
edition = "2021"
authors = ["HyperXOS Team <dev@hyperxos.org>"]
description = "macOS-style Pure Rust System Settings & Network Manager for HyperXOS"
license = "GPL-3.0-or-later"

[dependencies]
iced = { version = "0.14", features = ["wgpu", "image", "svg", "wayland", "tokio"] }
tokio = { version = "1.0", features = ["full"] }
sysinfo = "0.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
