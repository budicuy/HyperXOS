[package]
name = "hyper-x-hw"
version = "1.0.0"
edition = "2021"
authors = ["HyperXOS Development Team <dev@hyperxos.org>"]
description = "Pure Rust Hardware & GPU Auto-Detection Engine for HyperXOS Linux"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
