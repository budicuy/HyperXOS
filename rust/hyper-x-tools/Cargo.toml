[package]
name = "hyper-x-tools"
version = "2.2.0"
edition = "2021"
authors = ["HyperXOS Team <budicuy@hyperxos.org>"]
description = "Modern Glassmorphism System Dashboard, Performance Tweaker & Kernel Manager for HyperXOS"
license = "GPL-3.0-or-later"

[dependencies]
iced = { version = "0.14", features = ["wgpu", "image", "svg", "wayland", "x11", "tokio"] }
sysinfo = "0.33"
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
