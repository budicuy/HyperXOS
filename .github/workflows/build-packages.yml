name: HyperXOS Packages CI/CD Pipeline

on:
  push:
    paths:
      - 'packages/**'
      - 'rust/hyper-x-hw/**'
      - 'rust/hyper-x-installer/**'
      - 'rust/hyper-x-tools/**'
      - '.github/workflows/build-packages.yml'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-packages:
    name: Compile Packages & Publish to GitHub Releases
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Free Disk Space
        run: |
          echo "==> Freeing disk space on runner..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Official Packages in Arch Linux Container
        run: |
          echo "==> Starting isolated Arch Linux Docker container to build official packages..."
          docker run --rm --privileged \
            -v /dev:/dev \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash -c '
              set -euo pipefail
              git config --global --add safe.directory "*" || true

              echo "==> Configuring container pacman mirrors and trust..."
              sed -i "s/^Architecture = .*/Architecture = auto x86_64 x86_64_v3/" /etc/pacman.conf || true
              sed -i "s/^SigLevel    = .*/SigLevel = Optional DatabaseOptional TrustAll/" /etc/pacman.conf || true

              echo "==> Configuring pacman mirrors..."
              sed -i "s/^#Server/Server/" /etc/pacman.d/mirrorlist 2>/dev/null || true
              echo "Server = https://geo.mirror.pkgbuild.com/\$repo/os/\$arch" > /etc/pacman.d/mirrorlist.tmp
              cat /etc/pacman.d/mirrorlist >> /etc/pacman.d/mirrorlist.tmp
              mv /etc/pacman.d/mirrorlist.tmp /etc/pacman.d/mirrorlist

              echo "==> Setting up CachyOS mirrorlists..."
              cp -f archiso/airootfs/etc/pacman.d/cachyos* /etc/pacman.d/ 2>/dev/null || true

              echo "==> Initializing pacman keys..."
              pacman-key --init
              pacman-key --populate archlinux
              pacman-key --recv-keys F3B607488DB35A47 --keyserver keyserver.ubuntu.com || true
              pacman-key --lsign-key F3B607488DB35A47 || true
              pacman -Sy --noconfirm archlinux-keyring

              echo "==> Installing package build dependencies..."
              pacman -S --noconfirm --needed git rust cargo sudo pacman-contrib libarchive fontconfig freetype2 libxkbcommon polkit gptfdisk dosfstools btrfs-progs arch-install-scripts limine efibootmgr

              echo "==> Setting up unprivileged builder user for makepkg..."
              useradd -m -G wheel builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
              chown -R builder:builder /workspace

              echo "==> Creating clean distribution staging directory..."
              rm -rf /workspace/dist
              mkdir -p /workspace/dist

              PACKAGES=(
                "hyper-x-hw"
                "hyper-x-installer"
                "hyper-x-tools"
                "hyperxos-branding"
                "hyperxos-default-settings"
                "hyperxos-hooks"
                "hyperxos-keyring"
                "hyperxos-mirrorlist"
              )

              for pkg in "${PACKAGES[@]}"; do
                echo "--------------------------------------------------"
                echo "==> Compiling and packaging: ${pkg} ..."
                echo "--------------------------------------------------"
                su builder -c "cd /workspace/packages/${pkg} && makepkg -f --noconfirm --nodeps"
                cp -vf /workspace/packages/${pkg}/*.pkg.tar.zst /workspace/dist/
                rm -rf /workspace/packages/${pkg}/pkg /workspace/packages/${pkg}/src /workspace/packages/${pkg}/*.pkg.tar.zst
              done

              echo "==> Generating pacman database (hyperxos.db.tar.gz)..."
              cd /workspace/dist
              repo-add hyperxos.db.tar.gz *.pkg.tar.zst
              sha256sum *.pkg.tar.zst hyperxos.db.tar.gz > SHA256SUMS

              echo "==> Build completed! Distribution directory contents:"
              ls -lh /workspace/dist/

              chmod -R 0777 /workspace/dist
            '

      - name: Publish Packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: packages
          name: HyperXOS Official Packages (Automated CI Build)
          body: |
            ## 📦 HyperXOS Official Repository Packages
            Automated CI build generated by GitHub Actions from commit `${{ github.sha }}`.

            ### Included Packages:
            - `hyper-x-hw`: Pure Rust Hardware & GPU Auto-Detection Engine
            - `hyper-x-installer`: Pure Rust Native System Installer (Iced 0.14 + WGPU)
            - `hyper-x-tools`: Modern Glassmorphism System Dashboard & Tweaker
            - `hyperxos-branding`: Wallpapers, SDDM theme, Plymouth boot splash
            - `hyperxos-default-settings`: Desktop environments and user skeleton configurations
            - `hyperxos-hooks`: Pacman update and system trigger hooks
            - `hyperxos-keyring`: HyperXOS pacman package signing keys
            - `hyperxos-mirrorlist`: Official HyperXOS package server mirrorlist

            ### Verification:
            See `SHA256SUMS` for integrity verification.
          files: |
            dist/*.pkg.tar.zst
            dist/hyperxos.db.tar.gz
            dist/hyperxos.files.tar.gz
            dist/SHA256SUMS
          draft: false
          prerelease: false
