name: HyperXOS Production CI/CD & Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v2026.10.27)'
        required: false
        default: 'v2026.10.27'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Production ISO & Packages Unified Release
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Free Disk Space for ISO Build
        run: |
          echo "==> Freeing disk space on GitHub Actions runner..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift
          sudo docker image prune --all --force
          df -h

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Official Packages and Production ISO in Arch Linux Container
        run: |
          echo "==> Starting isolated Arch Linux Docker container with full privileged access..."
          docker run --rm --privileged \
            -v /dev:/dev \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash -c '
              set -euo pipefail
              git config --global --add safe.directory "*" || true

              echo "==> Configuring container pacman architecture and trust..."
              sed -i "s/^Architecture = .*/Architecture = auto x86_64 x86_64_v3/" /etc/pacman.conf || true
              sed -i "s/^SigLevel    = .*/SigLevel = Optional DatabaseOptional TrustAll/" /etc/pacman.conf || true

              echo "==> Configuring pacman mirrors..."
              sed -i "s/^#Server/Server/" /etc/pacman.d/mirrorlist 2>/dev/null || true
              echo "Server = https://geo.mirror.pkgbuild.com/\$repo/os/\$arch" > /etc/pacman.d/mirrorlist.tmp
              cat /etc/pacman.d/mirrorlist >> /etc/pacman.d/mirrorlist.tmp
              mv /etc/pacman.d/mirrorlist.tmp /etc/pacman.d/mirrorlist

              echo "==> Setting up CachyOS mirrorlists..."
              cp -f archiso/airootfs/etc/pacman.d/cachyos* /etc/pacman.d/ 2>/dev/null || true

              echo "==> Initializing pacman keys and CachyOS signing key..."
              pacman-key --init
              pacman-key --populate archlinux
              pacman-key --recv-keys F3B607488DB35A47 --keyserver keyserver.ubuntu.com || true
              pacman-key --lsign-key F3B607488DB35A47 || true
              pacman -Sy --noconfirm archlinux-keyring

              echo "==> Installing build dependencies for packages and ISO..."
              pacman -S --noconfirm --needed archiso git rust cargo sudo pacman-contrib libarchive fontconfig freetype2 libxkbcommon polkit gptfdisk dosfstools btrfs-progs arch-install-scripts limine efibootmgr squashfs-tools curl

              echo "==> Setting up unprivileged builder user for makepkg..."
              useradd -m -G wheel builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
              chown -R builder:builder /workspace

              echo "==> [Phase 1/2] Compiling 8 official HyperXOS packages from source..."
              mkdir -p /workspace/repo/x86_64
              PACKAGES=(
                "hyper-x-hw"
                "hyper-x-installer"
                "hyper-x-tools"
                "hyperxos-branding"
                "hyperxos-default-settings"
                "hyperxos-hooks"
                "hyperxos-keyring"
                "hyperxos-mirrorlist"
              )

              for pkg in "${PACKAGES[@]}"; do
                echo "--------------------------------------------------"
                echo "==> Compiling and packaging: ${pkg} ..."
                echo "--------------------------------------------------"
                su builder -c "cd /workspace/packages/${pkg} && makepkg -f --noconfirm --nodeps"
                cp -vf /workspace/packages/${pkg}/*.pkg.tar.zst /workspace/repo/x86_64/
                rm -rf /workspace/packages/${pkg}/pkg /workspace/packages/${pkg}/src /workspace/packages/${pkg}/*.pkg.tar.zst
              done

              echo "==> Updating pacman repository database..."
              cd /workspace/repo/x86_64
              repo-add hyperxos.db.tar.gz *.pkg.tar.zst
              sha256sum *.pkg.tar.zst hyperxos.db.tar.gz > SHA256SUMS

              echo "==> [Phase 2/2] Compiling HyperXOS Production ISO via hyperx CLI..."
              cd /workspace
              mkdir -p out work /var/tmp/hyperxos-work
              chmod 0777 /var/tmp/hyperxos-work

              cargo run --release --manifest-path rust/hyperx-cli/Cargo.toml -- production

              echo "==> Ensuring proper file permissions for host runner..."
              chmod -R 0777 /workspace/out /workspace/repo
            '

      - name: Verify ISO Artifacts & Append Checksums
        id: verify_artifacts
        run: |
          ls -lh out/
          ISO_FILE=$(ls out/hyperxos-*.iso 2>/dev/null | head -n 1)
          if [ -z "${ISO_FILE}" ] || [ ! -f "${ISO_FILE}" ]; then
            echo "[-] Error: ISO image was not found in out/ directory!"
            exit 1
          fi

          ISO_NAME=$(basename "${ISO_FILE}")
          ISO_SIZE=$(stat -c%s "${ISO_FILE}")
          ISO_SIZE_MB=$(( ISO_SIZE / 1024 / 1024 ))
          SHA256_VAL=$(cat "${ISO_FILE}.sha256" | awk '{print $1}')
          B2SUM_VAL=$(cat "${ISO_FILE}.b2sum" | awk '{print $1}')

          echo "iso_name=${ISO_NAME}" >> $GITHUB_OUTPUT
          echo "iso_size_mb=${ISO_SIZE_MB}" >> $GITHUB_OUTPUT

          echo "" >> RELEASE_NOTES.md
          echo "### 🛡️ Checksum & Spesifikasi Resmi dari GitHub Actions Runner" >> RELEASE_NOTES.md
          echo "- **Nama Berkas ISO:** \`${ISO_NAME}\`" >> RELEASE_NOTES.md
          echo "- **Ukuran File:** ${ISO_SIZE_MB} MB (${ISO_SIZE} bytes)" >> RELEASE_NOTES.md
          echo "- **SHA-256 (ISO):** \`${SHA256_VAL}\`" >> RELEASE_NOTES.md
          echo "- **BLAKE2b (ISO):** \`${B2SUM_VAL}\`" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### 📦 Paket Resmi Termasuk (Included Packages in this Release):" >> RELEASE_NOTES.md
          echo "- \`hyper-x-hw\`: Pure Rust Multi-Tier Hardware & GPU Auto-Detection Engine" >> RELEASE_NOTES.md
          echo "- \`hyper-x-installer\`: Pure Rust Native System Installer (Iced 0.14 + WGPU)" >> RELEASE_NOTES.md
          echo "- \`hyper-x-tools\`: Modern Glassmorphism System Dashboard & Tweaker" >> RELEASE_NOTES.md
          echo "- \`hyperxos-branding\`: Wallpapers, SDDM theme, Plymouth boot splash" >> RELEASE_NOTES.md
          echo "- \`hyperxos-default-settings\`: Desktop environments & skel configurations" >> RELEASE_NOTES.md
          echo "- \`hyperxos-hooks\`: Pacman update and system trigger hooks" >> RELEASE_NOTES.md
          echo "- \`hyperxos-keyring\`: HyperXOS pacman package signing keys" >> RELEASE_NOTES.md
          echo "- \`hyperxos-mirrorlist\`: Official HyperXOS package server mirrorlist" >> RELEASE_NOTES.md

      - name: Publish Unified GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'v2026.10.27' }}
          name: HyperXOS ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'v2026.10.27' }} — Official Production Release & Packages
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: |
            out/hyperxos-*.iso
            out/hyperxos-*.iso.sha256
            out/hyperxos-*.iso.b2sum
            repo/x86_64/*.pkg.tar.zst
            repo/x86_64/hyperxos.db.tar.gz
            repo/x86_64/hyperxos.files.tar.gz
            repo/x86_64/SHA256SUMS
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
