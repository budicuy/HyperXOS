LABEL hyperxos
TEXT HELP
Boot the HyperXOS install medium on BIOS (Default Wayland - Open Drivers).
ENDTEXT
MENU LABEL HyperXOS Live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% quiet loglevel=3

LABEL hyperxos_safegraphics
TEXT HELP
Boot the HyperXOS install medium with basic safe graphics (nomodeset).
ENDTEXT
MENU LABEL HyperXOS Live (Safe Graphics - nomodeset)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% nomodeset
