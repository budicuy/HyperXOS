#
# /etc/pacman.conf for HyperXOS Archiso
#
[options]
HoldPkg     = pacman glibc
Architecture = auto x86_64 x86_64_v3
ParallelDownloads = 5
SigLevel    = Optional DatabaseOptional TrustAll
LocalFileSigLevel = Optional
CacheDir    = /var/cache/pacman/pkg
NoExtract   = usr/share/help/* usr/share/doc/* usr/share/man/* usr/share/gtk-doc/*

[hyperxos]
SigLevel = Optional TrustAll
Server = file:///home/budicuy/Dokumen/HyperXOS/repo/$arch

[cachyos-v3]
SigLevel = Optional TrustAll
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-extra-v3]
SigLevel = Optional TrustAll
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-core-v3]
SigLevel = Optional TrustAll
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos]
SigLevel = Optional TrustAll
Include = /etc/pacman.d/cachyos-mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist