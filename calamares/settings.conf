# HyperXOS Calamares Installer Configuration (Pure Online Minimal Fresh Install)
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id:       initialize_pacman
    module:   shellprocess
    config:   shellprocess@initialize_pacman.conf
  - id:       postinstall
    module:   shellprocess
    config:   shellprocess@postinstall.conf
  - id:       cleanup
    module:   shellprocess
    config:   shellprocess@cleanup.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - shellprocess@initialize_pacman
      - pacstrap
      - machineid
      - fstab
      - localecfg
      - locale
      - keyboard
      - users
      - networkcfg
      - displaymanager
      - hwclock
      - services-systemd
      - initcpiocfg
      - initcpio
      - bootloader
      - shellprocess@postinstall
      - shellprocess@cleanup
      - removeuser
      - umount
  - show:
      - finished

branding: hyperxos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
