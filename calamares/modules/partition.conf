# HyperXOS Calamares Partitioning Configuration
---
efiSystemPartition: "/boot"
efiSystemPartitionSize: 1024M

userSwapChoices:
    - none
    - small
    - suspend
    - file

drawNestedPartitions: false
alwaysShowPartitionLabels: true
initialPartitioningChoice: erase
initialSwapChoice: none
defaultFileSystemType: "btrfs"
availableFileSystemTypes: ["btrfs", "ext4", "xfs", "f2fs"]

btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /var/log
      subvolume: /@log
    - mountPoint: /var/cache
      subvolume: /@cache
    - mountPoint: /.snapshots
      subvolume: /@snapshots

btrfsMountOptions:
    - subvolume: /@
      options: "compress=zstd:1,noatime,space_cache=v2"
    - subvolume: /@home
      options: "compress=zstd:1,noatime,space_cache=v2"
    - subvolume: /@log
      options: "compress=zstd:1,noatime,space_cache=v2"
    - subvolume: /@cache
      options: "compress=zstd:1,noatime,space_cache=v2"
    - subvolume: /@snapshots
      options: "compress=zstd:1,noatime,space_cache=v2"
