# HyperXOS Calamares - Pacstrap Base & Core Desktop Specification
# Installs minimal Arch Linux base + KDE Plasma 6 directly in one transaction
---
basePackages:
  # 1. Base Core & Essential System Utilities
  - base
  - linux
  - linux-firmware
  - mkinitcpio
  - which
  - nano
  - sudo
  - bash-completion
  - pciutils
  - usbutils

  # 2. Filesystems & Storage Support
  - btrfs-progs
  - e2fsprogs
  - dosfstools
  - cryptsetup
  - gptfdisk

  # 3. Networking Core
  - networkmanager
  - wireless-regdb
  - curl

  # 4. Audio & Display Server Core
  - pipewire
  - pipewire-pulse
  - pipewire-alsa
  - wireplumber
  - mesa
  - qt6-wayland
  - xorg-xwayland

  # 5. Bootloader (Default Limine)
  - limine
  - efibootmgr

  # 6. HyperXOS Branding, Keyrings & Management Tool
  - archlinux-keyring
  - cachyos-keyring
  - hyperxos-branding
  - hyperxos-default-settings
  - hyperxos-hooks
  - hyperxos-keyring
  - hyperxos-mirrorlist
  - paru
  - hyper-x-tools

  # 7. Minimal Core KDE Plasma 6 Desktop
  - plasma-desktop
  - plasma-workspace
  - kwin
  - sddm
  - sddm-kcm
  - dolphin
  - konsole
  - firefox
  - plasma-nm
  - plasma-pa
  - powerdevil
  - kscreen
  - breeze
  - breeze-gtk
  - kde-gtk-config
  - polkit-kde-agent
  - xdg-user-dirs
  - kpipewire
  - kdialog

postInstallFiles:
  - "/usr/local/bin/hw-detect-gpu"
  - "/usr/local/bin/hyperxos-postinstall"
