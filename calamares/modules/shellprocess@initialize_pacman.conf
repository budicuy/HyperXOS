# HyperXOS Calamares - Pacman Initialization for Pure Online Fresh Install
---
dontChroot: true
timeout: 600

script:
    - command: "mkdir -p ${ROOT}/etc/pacman.d ${ROOT}/etc ${ROOT}/usr/local/bin ${ROOT}/opt/hyperxos-repo/x86_64 ${ROOT}/var/lib/pacman/sync"
    - command: "cp -f /etc/resolv.conf ${ROOT}/etc/resolv.conf"
    - command: "cp -f /etc/pacman.conf ${ROOT}/etc/pacman.conf"
    - command: "cp -rf /etc/pacman.d/* ${ROOT}/etc/pacman.d/"
    - command: "cp -af /opt/hyperxos-repo/x86_64/. ${ROOT}/opt/hyperxos-repo/x86_64/ 2>/dev/null || true"
    - command: "cp -rf /var/lib/pacman/sync/* ${ROOT}/var/lib/pacman/sync/ 2>/dev/null || true"
    - command: "cp -f /usr/local/bin/hw-detect-gpu ${ROOT}/usr/local/bin/hw-detect-gpu 2>/dev/null && chmod 755 ${ROOT}/usr/local/bin/hw-detect-gpu 2>/dev/null || true"
    - command: "cp -f /usr/local/bin/hyperxos-postinstall ${ROOT}/usr/local/bin/hyperxos-postinstall 2>/dev/null && chmod 755 ${ROOT}/usr/local/bin/hyperxos-postinstall 2>/dev/null || true"
    - command: "pacman-key --init"
    - command: "pacman-key --populate archlinux cachyos hyperxos"
    - command: "mkdir -p ${ROOT}/etc/pacman.d/gnupg && chmod 700 ${ROOT}/etc/pacman.d/gnupg"
    - command: "cp -a /etc/pacman.d/gnupg/. ${ROOT}/etc/pacman.d/gnupg/ 2>/dev/null || true"

i18n:
    name: "Menyiapkan repositori online dan pacman..."
