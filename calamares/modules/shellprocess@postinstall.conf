# HyperXOS Post-Install Hardware Detection & Graphical Environment Setup
---
dontChroot: false
timeout: 600
script:
    - name: "Deteksi Perangkat Keras dan Konfigurasi Driver Grafis"
      command: "/bin/sh -c 'if [ -x /usr/local/bin/hw-detect-gpu ]; then /usr/local/bin/hw-detect-gpu /; fi'"

    - name: "Konfigurasi Lingkungan Grafis KDE Plasma & SDDM Wayland"
      command: "/bin/sh -c 'if [ -x /usr/local/bin/hyperxos-postinstall ]; then /usr/local/bin/hyperxos-postinstall; else mkdir -p /etc/sddm.conf.d && printf \"[General]\\nDisplayServer=wayland\\nGreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell\\n\\n[Wayland]\\nCompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1\\n\" > /etc/sddm.conf.d/10-wayland.conf && systemctl set-default graphical.target && (systemctl enable sddm.service || true); fi'"
