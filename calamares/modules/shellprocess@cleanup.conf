# HyperXOS Target Sanitization and Cleanup Configuration
---
dontChroot: false
timeout: 300
script:
    - name: "Pembersihan Shortcut Calamares pada Direktori Pengguna"
      command: "find /home -name 'calamares.desktop' -type f -delete 2>/dev/null || true"

    - name: "Regenerasi Initramfs Bersih pada Sistem Target"
      command: "mkinitcpio -P"
