# HyperXOS Calamares - Systemd Services Configuration
---
units:
   - name: "NetworkManager"
     action: "enable"
     mandatory: false

   - name: "sddm"
     action: "enable"
     mandatory: false

   - name: "gdm"
     action: "enable"
     mandatory: false

   - name: "bluetooth"
     action: "enable"
     mandatory: false

   - name: "systemd-timesyncd"
     action: "enable"
     mandatory: false

   - name: "fstrim.timer"
     action: "enable"
     mandatory: false

   - name: "qemu-guest-agent"
     action: "enable"
     mandatory: false

   - name: "spice-vdagentd"
     action: "enable"
     mandatory: false
