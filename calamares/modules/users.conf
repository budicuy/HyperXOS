# HyperXOS User Creation Configuration
---
defaultGroups:
    - wheel
    - rfkill
    - sys
    - name: users
      must_exist: true
      system: true
    - lp
    - video
    - network
    - storage
    - name: wheel
      must_exist: false
      system: true
    - audio
    - name: nopasswdlogin
      must_exist: false
      system: true

doAutologin:     true
sudoersGroup:    wheel
setRootPassword: true
doReusePassword: true

passwordRequirements:
    minLength: 4

allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
  shell: /bin/bash
  forbidden_names:
    - root
    - adm
    - bin
    - daemon
    - dbus
    - ftp
    - games
    - halt
    - http
    - lp
    - mail
    - man
    - news
    - nobody
    - ntp
    - operator
    - polkitd
    - postfix
    - rtkit
    - shutdown
    - sync
    - sys
    - systemd-coredump
    - systemd-network
    - systemd-resolve
    - systemd-timesync
    - uucp
    - uuidd
  home_permissions: "o700"
  nopasswd_group: "nopasswdlogin"

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "hyperxos-pc"
  forbidden_names: [ localhost ]

allowActiveDirectory: false

presets:
    fullName:
        editable: true
    loginName:
        editable: true
