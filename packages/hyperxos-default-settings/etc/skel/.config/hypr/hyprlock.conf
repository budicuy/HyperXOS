background {
    monitor =
    path = /usr/share/wallpapers/hyperxos-default.png
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

# Clock (Large Windows 11 style)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(248, 250, 252, 0.95)
    font_size = 84
    font_family = Plus Jakarta Sans Bold
    position = 0, 150
    halign = center
    valign = center
}

# Date Header
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(203, 213, 225, 0.85)
    font_size = 16
    font_family = Plus Jakarta Sans Medium
    position = 0, 80
    halign = center
    valign = center
}

# Password Box
input-field {
    monitor =
    size = 280, 44
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.28
    dots_center = true
    outer_color = rgba(0, 120, 212, 0.8)
    inner_color = rgba(15, 23, 42, 0.75)
    font_color = rgba(248, 250, 252, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##94a3b8">Enter Password</span>
    hide_input = false
    position = 0, -40
    halign = center
    valign = center
    rounding = 8
}
