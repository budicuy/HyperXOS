# ==============================================================================
# HyperXOS Windows 11 Fluent Theme for Hyprland
# ==============================================================================

autogenerated = 0

# Monitor setup (Auto-detect resolution & refresh rate)
monitor=,preferred,auto,1

# Autostart Environment & Essential Daemons
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = hyprpaper
exec-once = waybar
exec-once = swaync
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = systemctl --user start hyprpolkitagent || /usr/lib/hyprpolkitagent &

# Input Configuration (Windows-style standard behavior)
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
    }
}

# General Layout & Windows 11 Accent Borders
general {
    gaps_in = 6
    gaps_out = 10
    border_size = 1
    col.active_border = rgba(0078d4ff) rgba(8b5cf6ff) 45deg
    col.inactive_border = rgba(1e293b99)

    layout = dwindle
    resize_on_border = true
    hover_icon_on_border = true
}

# Visual Decorations (Dual-Kawase Blur & Acrylic Glassmorphism)
decoration {
    rounding = 10

    active_opacity = 0.98
    inactive_opacity = 0.92

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        vibrancy = 0.20
        ignore_opacity = true
    }

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(0, 0, 0, 0.40)
    }
}

# Windows 11 Fluent Smooth Animations
animations {
    enabled = true

    bezier = fluentDecel, 0.05, 0.9, 0.1, 1.0
    bezier = fluentEase, 0.16, 1, 0.3, 1

    animation = windows, 1, 4, fluentDecel, popin 80%
    animation = windowsOut, 1, 3, fluentEase, popin 80%
    animation = border, 1, 6, default
    animation = fade, 1, 4, fluentEase
    animation = workspaces, 1, 4, fluentDecel, slide
}

# Dwindle Tiling & Float Behaviors
dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true
}

# Window Rules (Windows-style floating utilities & popups)
windowrulev2 = float, class:^(wofi)$
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(hyper-x-tools)$
windowrulev2 = size 1024 640, class:^(hyper-x-tools)$
windowrulev2 = center, class:^(hyper-x-tools)$
windowrulev2 = float, class:^(hyper-x-installer)$
windowrulev2 = size 1120 720, class:^(hyper-x-installer)$
windowrulev2 = center, class:^(hyper-x-installer)$
windowrulev2 = float, class:^(thunar)$, title:^(File Operation Progress)$
windowrulev2 = float, class:^(thunar)$, title:^(Confirm to replace files)$
windowrulev2 = float, title:^(Open File)$
windowrulev2 = float, title:^(Save File)$

# ==============================================================================
# Windows 11 Keyboard Shortcuts & Navigation
# ==============================================================================
$mainMod = SUPER

# Start Menu (Tap Windows Key)
bindr = $mainMod, SUPER_L, exec, pkill wofi || wofi --show drun

# File Explorer (Win + E)
bind = $mainMod, E, exec, thunar

# Quick Settings & Action Center (Win + A)
bind = $mainMod, A, exec, swaync-client -t -sw

# Clipboard History (Win + V)
bind = $mainMod, V, exec, cliphist list | wofi -dmenu -p "Clipboard" | cliphist decode | wl-copy

# Snipping Tool / Screenshot (Win + Shift + S)
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -

# Lock Screen (Win + L)
bind = $mainMod, L, exec, hyprlock

# Core Apps
bind = $mainMod, Return, exec, foot
bind = $mainMod, T, exec, foot
bind = $mainMod, B, exec, firefox

# Window Controls
bind = ALT, F4, killactive,
bind = $mainMod, Q, killactive,
bind = $mainMod, Up, fullscreen, 1
bind = $mainMod, Down, togglefloating,
bind = $mainMod, Left, movewindow, l
bind = $mainMod, Right, movewindow, r
bind = $mainMod, D, togglespecialworkspace, desktop
bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,

# Mouse Window Control (Super + Drag / Resize)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume & Media Keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
